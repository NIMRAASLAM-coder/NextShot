name: Build iOS IPA

on:
  push:
    branches:
      - main # Triggers the build every time you push code to the main branch
  workflow_dispatch: # Allows you to manually click a button to run the build

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest # Fires up a virtual Apple Mac server

    steps:
      # Step 1: Clone your project code onto the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install Java (Required for Android Studio tools/Gradle)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 3: Install Flutter environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Step 4: Fetch dependencies
      - name: Install Dependencies
        run: flutter pub get

      # Step 5: Compile into an unsigned IPA file
      - name: Build IPA
        run: flutter build ipa --no-codesign

      # Step 6: Extract and save the .ipa file to your GitHub dashboard
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-app
          path: build/ios/ipa/*.ipa
