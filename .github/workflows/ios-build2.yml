name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Optional debug step: This prints your folder structure in the log to help you find the correct path
      - name: List Repository Structure
        run: ls -R

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # FIX: Added 'working-directory'. Change 'your_subfolder_name' to your actual project folder name
      - name: Install Dependencies
        working-directory: ./app 
        run: flutter pub get

      # FIX: Added 'working-directory' here as well
      - name: Build IPA
        working-directory: ./app 
        run: flutter build ipa --no-codesign

      # FIX: Updated path to look inside your subfolder for the output
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-app
          path: ./app/build/ios/ipa/*.ipa
